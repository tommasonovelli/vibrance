# >>> Vibrance
# Vibrance and Vibrance MusicLib: the production Compose file of the stack.
# See Vibrance's docs/operations.md.
#
# This file is the compose.yaml of MusicLib 1.2.0, unchanged, plus the
# blocks between a line `# >>> Vibrance` and the next `# <<< Vibrance`:
# this header, the `vibrance` service and its two volumes. Leave MusicLib's
# part as it is: scripts/check-compose-sync.sh of Vibrance compares it with
# MusicLib's release. Its comments are MusicLib's own, and where they name
# docs/operations.md they mean MusicLib's guide.
#
# The project is `musiclib`, as in MusicLib's own file, so an existing
# MusicLib installation keeps its containers and volumes.
#
#   mkdir -p import             the read-only /import of MusicLib
#   docker compose up -d --wait
#
# Settings go in .env next to this file (see env.example): MusicLib's and
# Vibrance's. Vibrance's version is on the `image:` line of its service; the
# version of MusicLib is the one this release of Vibrance was tested with.
# MusicLib's compose.yaml follows.
# <<< Vibrance
# Vibrance MusicLib: production Compose file.
# PostgreSQL and the app, from the published image. See docs/operations.md.
#
#   mkdir -p import             the read-only /import; Compose does not create it
#   docker compose up -d --wait
#
# Settings go in .env next to this file (see .env.example); every one has a
# default except MUSICLIB_PASSWORD, the sign-in password, which the app
# requires. Change the database password before the first start: see below.
#
# Development, tests and building the app from source: compose.dev.yaml
# (docs/docker.md). Both files are the Compose project `musiclib` with the
# same volumes, so an installation can switch from one to the other.
#
# Every image is pinned: PostgreSQL by version and digest,
# the app by its release version. To upgrade, change the app image's version
# below (or download the compose.yaml of the new release): it is the only
# place that names it.

name: musiclib

# The database password, defined here once for both services.
# DEFAULT PASSWORD: `musiclib`. Better change it BEFORE THE FIRST START:
# set POSTGRES_PASSWORD in .env (the README's install block writes a random
# one there), or replace `musiclib` below; .env wins when it sets one, and
# survives an upgrade that replaces this file.
# PostgreSQL reads it only when it creates its database, at the first start:
# changing it later does not change the database's password, and the app can
# no longer connect (docs/operations.md, "The database password", explains how
# to change it). The database publishes no port: other machines cannot reach it.
x-db-password: &db-password ${POSTGRES_PASSWORD:-musiclib}

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17.11-trixie@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    # `musiclib-db`: Compose sets COMPOSE_PROJECT_NAME to the project's name,
    # so another project, such as the restore project in docs/operations.md,
    # gets its own names.
    container_name: ${COMPOSE_PROJECT_NAME:-musiclib}-db
    <<: *hardening
    # The entrypoint starts as root, chowns PGDATA and drops to `postgres`
    # with gosu: these are the only capabilities it needs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Durability: these three stay on. They are the defaults; setting
    # them explicitly makes the requirement visible and overrides any stray
    # postgresql.conf / ALTER SYSTEM.
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
    # No published port: the app uses the Compose network;
    # for a psql session use `docker compose exec postgres psql -U musiclib`.
    healthcheck:
      # TCP on 127.0.0.1, not the Unix socket: during first initialization
      # the entrypoint runs a temporary server on the socket only, which must
      # not be reported as healthy.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--port=5432", "--username=musiclib", "--dbname=musiclib"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
      start_interval: 1s
    # The image stops with SIGINT (fast shutdown); leave time for the final
    # checkpoint instead of SIGKILL after the default 10s.
    stop_grace_period: 60s
    restart: unless-stopped
    environment:
      POSTGRES_USER: musiclib
      POSTGRES_DB: musiclib
      # x-db-password above. Read only when the db volume is first
      # initialized.
      POSTGRES_PASSWORD: *db-password
    volumes:
      - db:/var/lib/postgresql/data

  # -------------------------------------------------------------------------
  # The application.
  app:
    image: ghcr.io/tommasonovelli/musiclib:1.2.0
    # `musiclib`, or the project's name, as for postgres.
    container_name: ${COMPOSE_PROJECT_NAME:-musiclib}
    init: true
    restart: unless-stopped
    # The image runs as 1000:1000 and a new named volume is created owned by
    # it. Another uid needs MUSICLIB_DATA and MUSICLIB_BACKUP as host
    # directories owned by that uid (docs/operations.md).
    user: "${MUSICLIB_UID:-1000}:${MUSICLIB_GID:-1000}"
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    environment:
      # No password in the URL: the PostgreSQL client reads it from
      # PGPASSWORD (x-db-password above), so it need not be URL-safe.
      DATABASE_URL: postgres://musiclib@postgres:5432/musiclib?sslmode=disable
      PGPASSWORD: *db-password
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:${MUSICLIB_PORT:-8080}}
      HTTP_ADDR: ":8080"
      # Empty means the default: max(1, min(4, CPUs)).
      WORKERS: ${WORKERS:-}
      # The sign-in password, from .env: at least 12 characters; the app
      # refuses to start without it (password_invalid). Empty by default on
      # purpose, never `:?`: the offline commands do not need it, and a
      # missing value must not stop `docker compose` itself.
      MUSICLIB_PASSWORD: ${MUSICLIB_PASSWORD:-}
    ports:
      # Loopback by default; LAN access needs an explicit
      # MUSICLIB_BIND (and a matching PUBLIC_ORIGIN).
      - "${MUSICLIB_BIND:-127.0.0.1}:${MUSICLIB_PORT:-8080}:8080"
    volumes:
      # /data must be local ext4. MUSICLIB_DATA may be a named
      # volume (default) or an absolute host path on ext4 owned by MUSICLIB_UID.
      - ${MUSICLIB_DATA:-data}:/data
      # Backups are not inside /data. Prefer an external ext4 disk mounted
      # through MUSICLIB_BACKUP; the default is a separate named volume.
      - ${MUSICLIB_BACKUP:-backup}:/backup
      - type: bind
        source: ${MUSICLIB_IMPORT:-./import}
        target: /import
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
    # A publication already under way gets up to 30 s to finish.
    stop_grace_period: 45s
    # The slim image has no curl: the subcommand queries /health/ready on
    # HTTP_ADDR and exits 0 or 1. It takes no lock and starts nothing.
    # start_period covers the boot: waiting for PostgreSQL, migrations and
    # the volume checks.
    healthcheck:
      test: ["CMD", "/usr/local/bin/musiclibd", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 1s

  # >>> Vibrance
  # -------------------------------------------------------------------------
  # Vibrance, the listening server. It reads MusicLib's library/ from the
  # data volume, mounted read-only, and keeps its own state in its own
  # volume. It does not need MusicLib to run.
  vibrance:
    image: ghcr.io/tommasonovelli/vibrance:0.2.0
    # `musiclib-vibrance`, or the project's name, as for MusicLib's services.
    container_name: ${COMPOSE_PROJECT_NAME:-musiclib}-vibrance
    # Reaps the ffmpeg and ffprobe processes the server starts.
    init: true
    restart: unless-stopped
    # The image runs as 1000:1000 and new named volumes are created owned by
    # it. Never 0: Vibrance refuses to run as root (run_as_root).
    user: "${VIBRANCE_UID:-1000}:${VIBRANCE_GID:-1000}"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    environment:
      # The exact address clients open, scheme, host and port: the server
      # answers only requests for this host.
      VIBRANCE_PUBLIC_ORIGIN: ${VIBRANCE_PUBLIC_ORIGIN:-http://127.0.0.1:${VIBRANCE_PORT:-8090}}
      VIBRANCE_HTTP_ADDR: ":8080"
      # The first admin, read only while the database has no account.
      VIBRANCE_ADMIN_USERNAME: ${VIBRANCE_ADMIN_USERNAME:-admin}
      VIBRANCE_ADMIN_PASSWORD: ${VIBRANCE_ADMIN_PASSWORD:-}
      VIBRANCE_SCAN_INTERVAL: ${VIBRANCE_SCAN_INTERVAL:-5m}
      # Empty means the default: max(1, min(4, CPUs)).
      VIBRANCE_WORKERS: ${VIBRANCE_WORKERS:-}
    ports:
      # Loopback by default, as MusicLib.
      - "${VIBRANCE_BIND:-127.0.0.1}:${VIBRANCE_PORT:-8090}:8080"
    volumes:
      # MusicLib's data volume (or host folder), read-only: Vibrance reads
      # library/ and the markers .maintenance and .musiclib-store.
      - ${MUSICLIB_DATA:-data}:/musiclib:ro
      # The database (vibrance.db) and the cache of the thumbnails.
      - vibrance_state:/var/lib/vibrance
      # Vibrance's backups: a named volume, or a host folder owned by
      # VIBRANCE_UID.
      - ${VIBRANCE_BACKUP:-vibrance_backup}:/backup
    depends_on:
      # Only so that a new data volume is created by MusicLib first, with
      # MusicLib's owner. Vibrance runs with MusicLib stopped.
      app:
        condition: service_started
    # Open requests, such as an audio stream, get 10 s to end; then the
    # server closes them and its database. Docker's default of 10 s would
    # kill it at that very moment.
    stop_grace_period: 15s
    # The slim image has no curl: the subcommand asks /health/ready on
    # VIBRANCE_HTTP_ADDR and exits 0 or 1.
    healthcheck:
      test: ["CMD", "/usr/local/bin/vibrance", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 1s

  # <<< Vibrance
volumes:
  db:
  data:
  backup:
  # >>> Vibrance
  # Vibrance's state (vibrance.db, thumbs/) and its backups.
  vibrance_state:
  vibrance_backup:
  # <<< Vibrance
