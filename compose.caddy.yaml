# Caddy in front of Vibrance and MusicLib: HTTPS and one name for each, under
# one domain. See docs/operations.md, "HTTPS and two names".
#
# It is used together with compose.yaml. In .env:
#
#   COMPOSE_FILE=compose.yaml:compose.caddy.yaml
#   CF_API_TOKEN=...            the API token of your DNS provider
#
# then, with ./Caddyfile made from Caddyfile.example:
#
#   docker compose up -d --wait
#
# The image is Caddy with the DNS plugin of the provider, built here by xcaddy
# at the first start: a wildcard certificate obtained with the DNS-01
# challenge needs no port open to the Internet. Both images are pinned by
# version and digest, Caddy and the plugin by version. For another provider,
# replace the plugin in the build and the `dns` line of the Caddyfile
# (https://caddyserver.com/docs/modules/, "dns.providers"); to change them
# later, `docker compose up -d --build --wait`.

services:
  # No port on the host for the two products: only Caddy reaches them, over
  # the Compose network. `!reset` needs Docker Compose 2.24 or later.
  app:
    ports: !reset []
  vibrance:
    ports: !reset []

  caddy:
    build:
      dockerfile_inline: |
        FROM caddy:2.11.4-builder-alpine@sha256:0aa610043dab5da82ad0a0268e46bb852785e6f5160f12f1c6fe3f42903d7e1b AS build
        RUN xcaddy build v2.11.4 --with github.com/caddy-dns/cloudflare@v0.2.4
        FROM caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
        COPY --from=build /usr/bin/caddy /usr/bin/caddy
    # `musiclib-caddy`, or the project's name, as for the other services.
    container_name: ${COMPOSE_PROJECT_NAME:-musiclib}-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      # Read by the `dns` line of the Caddyfile, {env.CF_API_TOKEN}.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's certificates and keys, and its local certificate authority
      # (`tls internal`): keep this volume.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
