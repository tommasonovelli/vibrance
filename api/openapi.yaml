        - `added`: by the moment Vibrance first saw the album.

        Titles and names are ordered as for `GET /artists`, and albums that
        tie on every key by id, so the order is total. `order=desc` reverses
        the whole order. `artist` keeps only the albums of one artist; an id
        that is no artist's gives an empty list. A cursor belongs to the
        `sort` and the `order` it was read with: with others it answers
        `400 invalid_cursor`.
      parameters:
