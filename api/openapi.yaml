openapi: 3.0.3
info:
  title: Vibrance API
  version: "1"
  description: |
    Vibrance is a read-only listening server over the `library/` folder that
    Vibrance MusicLib produces. This API serves the catalog (artists, albums,
    tracks), the audio, the covers and the lyrics, a full-text search, and the
    favorites and private playlists of each user.

    ## Rules for every request

    - **Base path.** Every path of this document is under `/api/v1`. Within
      version 1 only compatible additions are made: new operations, new
      optional request fields, new response fields, new error codes.
    - **`Host`** must be the host and port of the public origin the server is
      configured with (`VIBRANCE_PUBLIC_ORIGIN`); otherwise the answer is
      `421 host_not_allowed`.
    - **`Origin`**, if sent, must be exactly that origin; otherwise the answer
      is `403 origin_not_allowed`. No CORS header is ever sent: the API is used
      from its own origin, or by clients that are not browsers.
    - **`X-Vibrance-Request: 1`** is required on every request other than GET
      and HEAD, signing in included; without it, or with another value, the
      answer is `403 request_header_required`. Every such operation declares
      it as a required header parameter, so a generated client and the page
      at `/api/docs` send it by themselves. It is not a credential: it only
      tells the server that the request was not made by a page of another
      site.
    - **A session.** Every operation needs a live session, except the ones
      marked as public. A session is the cookie `vibrance_session` that
      `POST /auth/login` sets, or a token of `POST /auth/tokens` sent as
      `Authorization: Bearer vb_...`. When a request carries both, the bearer
      token counts. Without a live session the answer is `401 login_required`.
    - **JSON bodies** are sent with `Content-Type: application/json`, are at
      most 1 MiB (`413 body_too_large`), hold exactly one JSON value, and have
      no unknown and no duplicate keys (`400 invalid_request`). Every field a
      request schema lists as required must be present; `null` is accepted only
      where the schema says so.
    - **GET and HEAD** change nothing a client can see. HEAD is answered
      wherever GET is, for the audio, the covers and the lyrics.

    ## Responses

    - JSON is UTF-8 with keys in `snake_case`. Ids are lowercase UUIDs.
      Durations are integers of milliseconds. Dates are RFC 3339 in UTC with
      exactly three digits of milliseconds and `Z`, for example
      `2026-09-30T12:34:56.000Z`. A field marked nullable is always present,
      with `null` when it has no value.
    - Every response carries `X-Request-Id`, errors included. JSON responses
      carry `Cache-Control: private, no-store`.
    - **Errors** are `{"code": ..., "message": ..., "details": {...}}`. The
      `code` is stable and is what a client should test; the `message` is for
      people and may change. `400` is a malformed request (JSON, a parameter,
      an enum, a cursor), `422` content that is well formed and not valid,
      `409` a conflict, `404` a resource that does not exist **or belongs to
      another user**, `503` something temporary.
    - A path this document does not list answers `404 not_found`; a method a
      path does not accept answers `405 method_not_allowed`, with `Allow`.

    ## Lists and cursors

    A paginated list takes `limit` (default 50, at most 200) and `after`, and
    answers `{"<name>": [...], "next": "<cursor>" | null}`. To read the next
    page send the value of `next` as `after`, with the same other parameters;
    `next` is `null` on the last page. A cursor is opaque: it names the last
    row of the page and the order it was read in, so it stays valid when that
    row is removed, and it is refused with `400 invalid_cursor` when it is not
    one the server wrote or belongs to another `sort` or `order`.

    ## Availability

    The catalog is an index of what the scanner found in the library. Nothing
    is ever deleted from it: when the files of an album or of a track are no
    longer there, it becomes *unavailable*, and it becomes available again,
    with the same id, when they come back. Unavailable albums are left out of
    the lists and of the search and answer `404 album_not_found`. Unavailable
    tracks are left out of the albums and of the search, but stay in
    playlists and favorites and can be read with `GET /tracks/{id}`, with
    `"available": false` and the last data known; their audio answers
    `404 track_unavailable`.

    A track id never changes while the track stays in its album. When
    MusicLib moves a track to another album, or an album is deleted and
    imported again, the track gets a new id: the playlist items and the
    favorites that pointed to the old one then point to the track that has
    the same audio, and the old id stays readable, unavailable.

    ## Playlists, `ETag` and `If-Match`

    Every change of a playlist, of its name or of its items, gives it a new
    `revision`. Its entity tag is the strong `"playlist:<id>:<revision>"`,
    quotes included, given both in the `ETag` header and in the `etag` field
    of the body (a proxy may weaken or drop the header; the field is always
    right). Every answer that carries one playlist has the header: reading
    it, creating it, a page of its items, and every change of it, with the
    tag of the new revision. Send it back as `If-Match` to make a change
    only if nobody changed the playlist in between: a tag of an older
    revision answers `412 precondition_failed`, and nothing is changed. A
    `W/` prefix is ignored, and the header may list several tags, separated
    by commas: one of them must be the current one. `*` is not the tag of a
    revision, and answers `412` like any other text. `If-Match` is required
    where a change depends on positions (inserting at a position, moving an
    item): without it the answer is `428 precondition_required`. Elsewhere
    it is optional, and checked when sent. A playlist that does not exist,
    or is of another user, answers `404 playlist_not_found` whatever the
    header says.

    ## Outside this document

    These paths are not under `/api/v1` and need no session:

    - `GET /api/openapi.yaml`: this document, as the server carries it.
    - `GET /api/docs`: a page that shows this document and can send requests
      to this server. It is made of files the server carries and asks no
      other host for anything.
    - `GET /`: a redirect to `/api/docs`.
    - `GET /health/live` and `GET /health/ready`: whether the process
      answers, and whether its startup is complete (`503 not_ready` until
      then). They are also outside the check of `Host`.
servers:
  - url: /api/v1
tags:
  - name: Server
    description: What the server is.
  - name: Auth
    description: Signing in and out.
  - name: Account
    description: The account and the sessions of the user of the request.
  - name: Users
    description: Administration of the accounts. Admins only.
  - name: Library
    description: The state of the scanner. Admins only.
  - name: Catalog
    description: Artists, albums and tracks.
  - name: Search
    description: Full-text search of the catalog.
  - name: Media
    description: Audio, covers and lyrics.
  - name: Favorites
    description: The favorite tracks of the user of the request.
  - name: Playlists
    description: The private playlists of the user of the request.
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /server:
    get:
      operationId: getServerInfo
      tags: [Server]
      summary: Name and version of the server
      description: Public. Tells a client what it is talking to before it signs in.
      security: []
      responses:
        "200":
          description: The server.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in with a cookie
      description: |
        Public. Checks the name and the password and starts a session of kind
        `cookie`. The session lasts 30 days from its last renewal: a request
        made in the second half of that time gives it 30 days again, so a
        browser stays signed in for as long as it is used, and signs in
        again after 30 days without a request.

        The cookie `vibrance_session` is `HttpOnly`, `SameSite=Strict`,
        `Path=/`, and `Secure` when the public origin is `https`. It is set
        here and never sent again: its `Max-Age` is 400 days, the most a
        browser keeps a cookie, and says nothing of the session, which only
        the server ends. A cookie that outlives its session answers
        `401 login_required`.

        Passwords are checked one at a time, and a refused attempt takes about
        one second. A wrong name, a wrong password and a disabled account all
        answer `401 invalid_credentials`, so the answer does not tell whether
        the account exists.
      security: []
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: The session cookie `vibrance_session`.
              required: true
              schema:
                type: string
                example: vibrance_session=vb_AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA; Path=/; Max-Age=34560000; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/tokens:
    post:
      operationId: createToken
      tags: [Auth]
      summary: Sign in with a token
      description: |
        Public. For clients that are not browsers. Checks the name and the
        password as `POST /auth/login` does, with the same
        `401 invalid_credentials`, and starts a session of kind `token`,
        which lasts 90 days and is renewed while it is used. The
        token is in the answer, **once**: the server keeps only its hash. Send
        it as `Authorization: Bearer <token>`.
      security: []
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Signed in. The token is in the body.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Sign out
      description: |
        Revokes the session of the request, cookie or token, at once, and
        tells the browser to drop the cookie.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
      responses:
        "204":
          description: Signed out.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
            Set-Cookie:
              description: The cookie `vibrance_session`, emptied and expired.
              schema:
                type: string
                example: vibrance_session=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me:
    get:
      operationId: getMe
      tags: [Account]
      summary: The user of the request
      description: The account the session of the request belongs to. A client asks this to learn who is signed in and whether it is an admin.
      responses:
        "200":
          description: The user.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me/password:
    put:
      operationId: changePassword
      tags: [Account]
      summary: Change the password
      description: |
        Changes the password of the user of the request and revokes every
        **other** session of that user; the session of the request stays.

        `422 current_password_invalid`: the current password is wrong (the
        check takes about one second, as a refused sign-in does).
        `422 password_invalid`: the new password is not 12 to 1024 bytes, or
        has control characters.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me/sessions:
    get:
      operationId: listSessions
      tags: [Account]
      summary: The live sessions of the user
      description: Every session of the user of the request that has not expired, the one of the request marked `current`.
      responses:
        "200":
          description: The sessions.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /me/sessions/{id}:
    delete:
      operationId: revokeSession
      tags: [Account]
      summary: Revoke a session
      description: |
        Revokes one session of the user of the request, at once: a device that
        was lost, a token no longer needed. A session that does not exist, or
        is of another user, answers `404 session_not_found`.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Revoked.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /admin/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: Every account
      description: Admins only (`403 forbidden` otherwise).
      responses:
        "200":
          description: The accounts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createUser
      tags: [Users]
      summary: Create an account
      description: |
        Admins only (`403 forbidden` otherwise). There is no self-registration:
        an admin creates every account.

        `409 username_taken`: the name is in use.
        `422 username_invalid`: the name is not 3 to 32 characters of
        `a-z 0-9 . _ -` beginning with a letter or a digit.
        `422 password_invalid`: the password is not 12 to 1024 bytes, or has
        control characters.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [Users]
      summary: One account
      description: Admins only (`403 forbidden` otherwise). `404 user_not_found` when there is no such account.
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: The account.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    put:
      operationId: updateUser
      tags: [Users]
      summary: Change the role of an account, or disable it
      description: |
        Admins only (`403 forbidden` otherwise). Both fields are sent, with
        the values the account must have. A disabled account cannot sign in,
        and loses its sessions at once.

        `404 user_not_found`: there is no such account.
        `409 last_admin`: the change would leave no enabled admin.
        `409 cannot_modify_self`: an admin cannot disable their own account;
        demoting it is allowed while another enabled admin is left.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The account, as it is now.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete an account
      description: |
        Admins only (`403 forbidden` otherwise). Deletes the account with its
        sessions, its favorites and its playlists. It cannot be undone.

        `404 user_not_found`: there is no such account.
        `409 last_admin`: it is the last enabled admin.
        `409 cannot_modify_self`: an admin cannot delete their own account.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
        - $ref: "#/components/parameters/PathId"
      responses:
        "204":
          description: Deleted.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /admin/users/{id}/password:
    put:
      operationId: resetUserPassword
      tags: [Users]
      summary: Set the password of an account
      description: |
        Admins only (`403 forbidden` otherwise). Sets a new password and
        revokes every session of that account. An admin changes their own
        password with `PUT /me/password`.

        `404 user_not_found`: there is no such account.
        `422 password_invalid`: the password is not 12 to 1024 bytes, or has
        control characters.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
        - $ref: "#/components/parameters/PathId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetUserPasswordRequest"
      responses:
        "204":
          description: Set.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /admin/library:
    get:
      operationId: getLibraryStatus
      tags: [Library]
      summary: The state of the library and of the scanner
      description: |
        Admins only (`403 forbidden` otherwise). What the scanner is doing,
        how its last cycle went, how many albums and tracks the index holds,
        and the album folders it could not index.
      responses:
        "200":
          description: The state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
  /admin/library/scan:
    post:
      operationId: scanLibrary
      tags: [Library]
      summary: Ask for a scan of the library
      description: |
        Admins only (`403 forbidden` otherwise). Queues one cycle of the
        scanner and answers at once with the state as it is, without waiting
        for the cycle. Requests coalesce: it answers `202` also when a cycle
        is running or waiting, and at most one cycle waits. A scan is always
        safe to ask for: it deletes nothing. The state in the answer may still
        be `idle`, with the last scan before this request: read
        `GET /admin/library` again to follow the cycle. While MusicLib is in
        maintenance, or its library is not there, the cycle looks at nothing
        and the state says why.
      parameters:
        - $ref: "#/components/parameters/XVibranceRequest"
      responses:
        "202":
          description: Queued. The state as it is now.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
