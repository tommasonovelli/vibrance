        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "421":
          $ref: "#/components/responses/MisdirectedRequest"
        "500":
          $ref: "#/components/responses/Internal"
